
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | ConectaFile</title>

    <link rel="stylesheet" href="src/css/cad.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <main class="register-container">

        <a href="index.html" class="logo">
            <i class="bi bi-cloud"></i>
            <span>ConectaFile</span>
        </a>

        <section class="register-card">

            <div class="register-heading">
                <h1>Criar sua conta</h1>
                <p>Comece a organizar seus documentos.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="username">Nome</label>
                    <div class="input-container">
                        <i class="bi bi-person"></i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Seu nome"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <i class="bi bi-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-container">
                        <i class="bi bi-lock"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Mínimo de 8 caracteres"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-password="password"
                            aria-label="Mostrar senha"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar senha</label>
                    <div class="input-container">
                        <i class="bi bi-shield-lock"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Digite a senha novamente"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-password="confirmPassword"
                            aria-label="Mostrar senha"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="register-button">
                    Criar conta
                    <i class="bi bi-arrow-right"></i>
                </button>

                <p id="registerMessage" class="message" aria-live="polite"></p>

            </form>

            <div class="login-link">
                Já tem uma conta?
                <a href="logi.html">Entrar</a>
            </div>

        </section>

        <a href="index.html" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Voltar ao início
        </a>

        <footer>ConectaFile © 2026</footer>

    </main>

    <script src="src/js/cad.js"></script>
</body>
</html>
