<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | ConectaFile</title>
    <link rel="stylesheet" href="src/css/logi.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <main class="login-container">

        <a href="index.html" class="logo">
            <i class="bi bi-cloud"></i>
            <span>ConectaFile</span>
        </a>
        <section class="login-card">

            <div class="login-heading">
                <h1>Bem-vindo de volta</h1>
                <p>Entre na sua conta para continuar.</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>

                    <div class="input-container">
                        <i class="bi bi-lock"></i>

                        <input type="password" id="password" name="password" placeholder="Digite sua senha"
                            autocomplete="current-password" required>

                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Mostrar senha">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Entrar
                    <i class="bi bi-arrow-right"></i>
                </button>

                <p id="loginMessage" class="message" aria-live="polite"></p>

            </form>

            <div class="register-link">
                Ainda não tem uma conta?
                <a href="cada.html">Criar conta</a>
            </div>

        </section>

        <a href="index.html" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Voltar ao início
        </a>

        <footer>
            ConectaFile © 2026
        </footer>

    </main>

    <script src="src/js/log.js"></script>
</body>

</html>
